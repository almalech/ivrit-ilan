></span></div></section><section class="panel"><h2>🎧 J'écoute les mots</h2><p>Appuie sur 🔊 pour écouter sans avoir besoin de lire beaucoup.</p><button class="action secondary" onclick="nav('words')">🔊 Mes mots hébreux</button></section>`}
function map(){let stars=Object.values(data.stars).reduce((a,b)=>a+b,0),p=Math.min(20,data.unlock);let nodes='';let points=[];for(let n=1;n<=20;n++){let y=94-(n-1)*4.32,x=50+Math.sin((n-1)*1.8)*31;points.push(x+','+y);let locked=n>data.unlock,done=!!data.stars[n];nodes+=`<button style="--x:${x}%;--y:${y}%" class="level ${locked?'locked':done?'done':'current'}" onclick="openLevel(${n})" ${locked?'disabled':''} aria-label="Niveau ${n}">${locked?'🔒':n}<span class="mark">${done?'⭐'.repeat(data.stars[n]):''}</span></button>`; if(n===1||n===5||n===10||n===15||n===20)nodes+=`<span class="lvlcaption" style="--x:${x}%;--y:${y}%">${n===20?'🏆 Coupe':NAMES[n-1]}</span>`}
$('view').innerHTML=`<section class="panel"><h2 class="title">🏗️ Ma ville en briques</h2><p class="sub">20 chantiers à réussir, du plus facile au plus difficile !</p><div class="stats"><span>⭐ ${stars} étoiles</span><span>🏆 ${Math.min(20,data.unlock-1)}/20</span></div><div class="progress"><span style="width:${Math.min(100,(data.unlock-1)*5)}%"></span></div></section><div class="world"><svg class="level-path" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${points.join(' ')}"></polyline><polyline class="inner" points="${points.join(' ')}"></polyline></svg>${nodes}</div><section class="panel"><h2>🧱 Niveau ${p} — ${NAMES[p-1]}</h2><p>Écoute, touche les bonnes réponses et gagne des étoiles !</p><button class="action" onclick="openLevel(${p})">▶ Jouer au niveau ${p}</button></section>`}
function openLevel(n){if(n>data.unlock)return;stopTimer();level=n;tab='play';startGame(TYPES[n-1],n,false)};
function pool(difficulty=1,count=20){let cap=Math.min(WORDS.length,Math.max(18,14+difficulty*3));return WORDS.slice(0,cap)};
function startGame(mode,n=0,standalone=false){stopTimer();const difficulty=n?Math.ceil(n/5):2;game={mode,n,standalone,difficulty,score:0,errors:0,total:n?Math.min(10,4+Math.ceil(n/3)):8,index:0,question:null,selected:null,notice:'',finished:false,pairs:[],matched:[],tiles:[],seconds:Math.max(6,19-difficulty*2),timeLeft:Math.max(6,19-difficulty*2),buildPieces:0,fallAt:5,turn:0};if(['pairs','memory'].includes(mode)) setupPairs();else if(mode==='rain')setupRain();else makeQ();renderGame();if(mode==='speed')beginSpeed();if(mode==='rain')beginRain()}
function pickQuestion(){let list=pool(game.difficulty);let w=list[rand(list.length)];let dir=rand(2)===0?'he':'fr';let opts=shuffle([w,...shuffle(list.filter(q=>q.id!==w.id)).slice(0,3)]);return{w,dir,options:opts,correct:w.id}}
function makeQ(){game.question=pickQuestion();game.selected=null;game.notice='';game.timeLeft=game.seconds}
function questionHTML(){let q=game.question;if(!q)return'';let mode=game.mode,side=q.dir==='he',qtext=side?q.w.he:q.w.fr,lang=side?'he-IL':'fr-FR';let choices=q.options.map(o=>{let answer=side?o.fr:o.he,highlight=game.selected===o.id?(o.id===q.correct?'correct':'wrong'):'';let cls=side?'':'he';return `<button class="choice ${highlight}" onclick="answer(${o.id})" ${game.selected!==null?'disabled':''}><span class="txt ${cls}">${esc(answer)}</span><span class="aud" onclick="event.stopPropagation();speak('${esc(answer).replace(/&#39;/g,"\\'")}','${side?'fr-FR':'he-IL'}')">🔊</span></button>`}).join('');return `<div class="prompt"><div class="note">${side?'Écoute et trouve en français':'Écoute et trouve en hébreu'}</div><div class="word ${side?'he':''}">${esc(qtext)}</div><button class="audio" onclick="speak(${arg(qtext)},'${lang}')">🔊 Écouter</button></div><div class="choices">${choices}</div>`}
function answer(id){if(!game||game.finished||game.selected!==null)return;game.selected=id;let ok=id===game.question.correct;if(ok){game.score++;game.notice='✅ Bravo ! Tu as trouvé !'}else{game.errors++;game.notice='💛 Essaie encore au prochain mot !';}if(game.mode==='build'){if(ok)game.buildPieces=Math.min(8,game.buildPieces+1);else{game.shatter=game.buildPieces;game.buildPieces=0}}if(game.mode==='speed'){clearInterval(timer);timer=null}renderGame();if(game.mode==='build'&&game.shatter){let robot=$('robot');if(robot){robot.classList.add('break');robot.querySelectorAll('.robotpiece').forEach((e,i)=>{if(i<game.shatter)e.classList.add('on')})}setTimeout(()=>{if(game){game.shatter=0;renderGame()}},900)}}
function nextQ(){if(game.selected===null)return;game.index++;if(game.index>=game.total){finish();return}makeQ();renderGame();if(game.mode==='speed')beginSpeed()}
function beginSpeed(){stopTimer();timer=setInterval(()=>{if(!game||game.mode!=='speed'||game.finished){stopTimer();return}if(game.selected!==null)return;game.timeLeft=Math.max(0,game.timeLeft-.2);let el=$('timefill');if(el)el.style.width=(game.timeLeft/game.seconds*100)+'%';let n=$('timecount');if(n)n.textContent=Math.ceil(game.timeLeft);if(game.timeLeft<=0){stopTimer();game.selected=-1;game.errors++;game.notice='⏰ Le temps est écoulé !';renderGame()}},200)}
function setupPairs(){let list=shuffle(pool(game.difficulty)).slice(0,Math.min(7,3+game.difficulty));let cards=shuffle(list.flatMap(w=>[{tid:'h'+w.id,key:w.id,txt:w.he,lang:'he-IL'},{tid:'f'+w.id,key:w.id,txt:w.fr,lang:'fr-FR'}]));game.tiles=cards;game.selected=null;game.matched=[];game.total=list.length}
function selectPair(tid){let c=game.tiles.find(z=>z.tid===tid);if(!c||game.matched.includes(tid)||game.busy)return;if(!game.selected){game.selected=tid;renderGame();return}if(game.selected===tid){game.selected=null;renderGame();return}let first=game.tiles.find(z=>z.tid===game.selected);if(first.key===c.key&&first.tid!==c.tid){game.matched.push(first.tid,c.tid);game.score++;game.notice='✅ Une paire !';game.selected=null;renderGame();if(game.matched.length===game.tiles.length)finish();}else{game.errors++;game.notice='💛 Pas la même paire !';const a=game.selected,b=tid;game.second=b;game.busy=true;renderGame();setTimeout(()=>{if(!game||!game.busy)return;game.busy=false;game.selected=null;game.second=null;game.notice='';renderGame()},750)}}
function pairHTML(){return `<div class="pair-grid">${game.tiles.map(c=>{let matched=game.matched.includes(c.tid),visible=game.mode!=='memory'||matched||game.selected===c.tid||game.second===c.tid;return `<button class="pair ${matched?'matched':game.selected===c.tid||game.second===c.tid?'chosen':''}" onclick="selectPair('${c.tid}')" ${matched?'disabled':''}>${visible?`<span class="${c.lang==='he-IL'?'he':''}">${esc(c.txt)}</span><span class="speak" onclick="event.stopPropagation();speak(${arg(c.txt)},'${c.lang}')">🔊</span>`:'❓'}</button>`}).join('')}</div>`}
function setupRain(){game.mode='rain';let list=shuffle(pool(game.difficulty)).slice(0,14);game.rainPool=list;game.rainPairs=list.slice(0,10);let heb=shuffle(game.rainPairs.map(w=>({tid:'h'+w.id,key:w.id,txt:w.he,lang:'he-IL'})));let fr=shuffle(game.rainPairs.map(w=>({tid:'f'+w.id,key:w.id,txt:w.fr,lang:'fr-FR'})));let tiles=[];let dist=fr.slice();for(let tries=0;tries<250;tries++){let candidate=shuffle(fr);if(candidate.every((v,i)=>v.key!==heb[i].key && v.key!==heb[(i+1)%10].key)){dist=candidate;break}}for(let i=0;i<10;i++){tiles.push(heb[i],dist[i])}game.tiles=tiles;game.selected=null;game.matched=[];game.total=10;game.fallAt=5;game.secondsToDrop=5;game.rainPool=shuffle(list.slice(10));game.rainNext=0;game.maxTiles=32;game.streak=0}
function rainAdd(){if(game.tiles.length>=game.maxTiles){finish(true);return}let list=game.rainPool;if(!list.length)list=shuffle(pool(game.difficulty)).slice(10);if(!list.length)list=pool(game.difficulty);let a=list[game.rainNext++%list.length],b=list[game.rainNext++%list.length];if(a.id===b.id)b=list[(game.rainNext++)%list.length]||pool(game.difficulty).find(w=>w.id!==a.id);game.turn++;const tileA={tid:'h'+a.id+'-'+game.turn,key:a.id,txt:a.he,lang:'he-IL'},tileB={tid:'f'+b.id+'-'+game.turn,key:b.id,txt:b.fr,lang:'fr-FR'};let next=shuffle([tileA,tileB]);game.tiles.push(...next);if(game.tiles.length>=game.maxTiles)finish(true);else renderGame()}
function beginRain(){stopTimer();timer=setInterval(()=>{if(!game||game.mode!=='rain'||game.finished){stopTimer();return}game.secondsToDrop=Math.max(0,game.secondsToDrop-1);if(game.secondsToDrop===0){game.secondsToDrop=5;rainAdd()}let t=$('fallcount');if(t)t.textContent=game.secondsToDrop;},1000)}
function rainSelect(tid){if(!game||game.finished)return;let c=game.tiles.find(x=>x.tid===tid);if(!c)return;if(!game.selected){game.selected=tid;renderGame();return}if(game.selected===tid){game.selected=null;renderGame();return}let a=game.tiles.find(x=>x.tid===game.selected);if(a.key===c.key&&a.lang!==c.lang){game.score++;game.tiles=game.tiles.filter(z=>z.tid!==tid&&z.tid!==game.selected);game.selected=null;game.notice='✅ Zoug !';if(game.tiles.length===0){finish();return}}else{game.errors++;game.selected=null;game.notice='Essaie une autre paire !'}renderGame()}
function rainHTML(){return `<div class="rain-stats"><span>🧱 ${game.tiles.length}/${game.maxTiles} tuiles</span><span>⭐ ${game.score} paires</span><span>⏳ <b id="fallcount">${game.secondsToDrop}</b> sec</span></div><p class="note">Trouve les paires. Deux nouvelles briques tombent toutes les 5 secondes. Les traductions ne sont pas voisines !</p><div class="rainboard">${game.tiles.map(c=>`<button class="rain-tile ${game.selected===c.tid?'chosen':''} ${c.lang==='he-IL'?'he':''}" onclick="rainSelect('${c.tid}')" ">${esc(c.txt)}<span class="aud" onclick="event.stopPropagation();speak(${arg(c.txt)},'${c.lang}')">🔊</span></button>`).join('')}</div><p class="note">Appuie sur 🔊 sous une brique pour écouter le mot.</p>`}
function robotHTML(){let pieces=['leg1','leg2','torso','arm1','arm2','head','eye1','eye2','antenna'];return `<div class="build-stage"><div class="robot" id="robot">${pieces.map((p,i)=>`<div class="robotpiece ${p} ${i<game.buildPieces?'on':''}" style="--dx:${i%2?'110px':'-110px'}"></div>`).join('')}</div><div class="pill">🧱 ${game.buildPieces}/8 briques construites</div></div>`}
function renderGame(){if(!game)return;let n=game.n;let title=game.mode==='champion'?'🏆 Grand championnat':({translate:'🌍 Traduire',pairs:'🔗 Relier les mots',memory:'🃏 Memory',speed:'⚡ Rapidité',build:'🤖 Mon robot',rain:'🧱 Pluie de mots'})[game.mode];let intro=n?`Niveau ${n} — ${NAMES[n-1]}`:'Jeu libre';let more='',done=game.finished;
if(done){result();return}if(game.mode==='pairs'||game.mode==='memory'){more=pairHTML()}else if(game.mode==='rain'){more=rainHTML()}else{if(game.mode==='build')more=robotHTML();if(game.mode==='speed')more+=`<div class="timerbar"><span id="timefill" style="width:${game.timeLeft/game.seconds*100}%"></span></div><div class="chip">⏱️ <span id="timecount">${Math.ceil(game.timeLeft)}</span> secondes</div>`;more+=questionHTML();}
let actions=game.selected!==null && !['pairs','memory','rain'].includes(game.mode)?`<button class="action" onclick="nextQ()">${game.index+1>=game.total?'🏆 Terminer':'➡️ Question suivante'}</button>`:'';
$('view').innerHTML=`<section class="panel"><div class="quiz-head"><div><div class="title">${title}</div><div class="sub">${intro}</div></div><button class="tiny-audio" onclick="speak('כָּל הַכָּבוֹד!','he-IL')">🔊</button></div><div class="stats"><span>⭐ ${game.score} bonnes</span><span>${game.mode==='pairs'||game.mode==='memory'?`${game.score}/${game.total} paires`:game.mode==='rain'?'Trouve les zoug':`${game.index+1}/${game.total}`}</span></div>${more}${game.notice?`<div class="feedback ${game.notice.startsWith('✅')?'good':'bad'}">${game.notice}</div>`:''}${actions}<div class="bottom"><button class="action secondary" onclick="nav('map')">↩️ Carte</button><button class="action secondary" onclick="startGame('${game.mode}',${n},${game.standalone})">🔄 Rejouer</button></div></section>`}
function finish(lost=false){if(!game)return;stopTimer();game.finished=true;game.lost=lost;if(game.n && !lost){let threshold=game.mode==='rain'?Math.max(5,game.score):Math.ceil(game.total*.6);let success=game.mode==='rain'?game.score>=5:game.score>=threshold;if(success){let s=game.mode==='rain'?Math.min(3,game.score>=14?3:game.score>=8?2:1):game.errors===0?3:game.score>=game.total*.8?2:1;data.stars[game.n]=Math.max(s,data.stars[game.n]||0);data.unlock=Math.min(21,Math.max(data.unlock,game.n+1));save()}}result()}
function result(){let won=!game.lost && (game.n===0||game.mode==='rain'?game.score>=5:game.score>=Math.ceil(game.total*.6));let star=game.n?data.stars[game.n]||0:Math.min(3,game.score>=8?3:game.score>=5?2:1);let next=game.n?Math.min(20,game.n+1):0;$('view').innerHTML=`<section class="panel" style="text-align:center"><div class="cloud">${won?'🏆🤖🎉':'🧱💪'}</div><h2 class="title">${won?'Bravo Ilan !':'On réessaie !'}</h2><p>${won?'Tu as construit une belle victoire !':'Encore un essai et tu progresseras !'}</p><div class="bigscore">${game.score} ⭐</div><div style="font-size:30px;margin:8px">${won?'⭐'.repeat(star):'🧱'}</div><p class="note">${game.mode==='rain'?'Paires retrouvées':'Bonnes réponses'} : ${game.score}</p><div class="bottom"><button class="action secondary" onclick="startGame('${game.mode}',${game.n},${game.standalone})">🔄 Rejouer</button>${won&&game.n&&game.n<20?`<button class="action" onclick="openLevel(${next})">➡️ Niveau ${next}</button>`:`<button class="action" onclick="nav('map')">🗺️ Carte</button>`}</div></section>`;if(won)speak('כָּל הַכָּבוֹד!','he-IL')}
function words(){let q=WORDS;let cards=q.map(w=>`<div class="pair" style="min-height:90px"><div class="he" style="font-size:24px">${esc(w.he)}</div><div style="font-size:13px">${esc(w.fr)}</div><div><button class="tiny-audio" onclick="speak(${arg(w.he)},'he-IL')">🇮🇱 🔊</button> <button class="tiny-audio" onclick="speak(${arg(w.fr)},'fr-FR')">🇫🇷 🔊</button></div></div>`).join('');$('view').innerHTML=`<section class="panel"><h2 class="title">🔊 Mes mots avec nékoudot</h2><p class="sub">Appuie sur le drapeau pour écouter en hébreu ou en français.</p><div class="pair-grid">${cards}</div></section>`}
// Expose one safe global namespace for inline iOS-compatible controls.
Object.assign(window,{nav,openLevel,startGame,answer,nextQ,selectPair,rainSelect,speak});draw();
</script></body></html>
