/* Continuité de l'aventure familiale */
.worldintro{display:flex;gap:14px;align-items:center;background:linear-gradient(140deg,#fff9df,#ebf5ff)}
.worldfaces{display:flex;align-items:center;min-width:96px}.buddy{width:59px;height:59px;border-radius:20px;border:3px solid white;box-shadow:0 4px 12px #24386235;object-fit:cover;background:white}.worldfaces .buddy+.buddy{margin-left:-20px;margin-top:36px}.worldkicker{font-weight:900;letter-spacing:2px;font-size:11px;color:#2d7cd6}.worldintro .title{font-size:21px;margin:3px 0}.worldintro .stats{font-size:11px;flex-wrap:wrap}
.adventure-scroll{height:65vh;min-height:470px;overflow-y:auto;overflow-x:hidden;border-radius:24px;border:5px solid white;box-shadow:0 7px 22px #294a7533;scroll-behavior:smooth;overscroll-behavior:contain;position:relative;scrollbar-width:thin}
.adventure-land{height:2200px;position:relative;overflow:hidden;background-size:100% 100%}
.adventure-scroll.toy .adventure-land{background:linear-gradient(#b5dcff 0%,#e2f4ff 34%,#7bd5a8 70%,#eaffc5)}
.adventure-scroll.rose .adventure-land{background:radial-gradient(ellipse at 30% 70%,#ffe5ef,transparent 50%),linear-gradient(#d8bdff,#ffe6ed 36%,#ffc8dd 70%,#b6ebc2)}
.adventure-scroll.gym .adventure-land{background:radial-gradient(ellipse at 80% 58%,#ffd9f3,transparent 50%),linear-gradient(#c5bdff,#ebe0ff 45%,#d2d0ff 76%,#f3d6ff)}
.adventure-scroll.beach .adventure-land{background:linear-gradient(#5bbce7 0%,#9ee6fb 34%,#f4e7ad 35%,#fce3a1 75%,#b1eade)}
.adventure-scroll.foot .adventure-land{background:linear-gradient(#133b86,#3976d4 25%,#a5dafa 40%,#4cb991 41%,#67cb8d 100%)}
.adventure-path{position:absolute;inset:0;height:100%;width:100%;pointer-events:none}.adventure-path polyline{fill:none;stroke:#fff9e8;stroke-width:22px;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 3px 3px #344f7380);stroke-dasharray:1 0}
.world-ornament{position:absolute;font-size:40px;word-spacing:40px;white-space:nowrap;letter-spacing:23px;opacity:.74;filter:drop-shadow(0 4px 5px #fff6);pointer-events:none}.world-ornament.top{top:90px;left:5%}.world-ornament.middle{top:980px;right:0}.world-ornament.bottom{bottom:170px;left:3%}
.adventure-node{position:absolute;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:22px;z-index:3;background:#ffe44f;color:#19315c;border:4px solid white;box-shadow:0 7px 0 #ad8b35,0 9px 16px #25466955;font-size:23px;font-weight:900;display:grid;place-content:center;line-height:1.03}.adventure-node small{font-size:10px;min-height:10px}.adventure-node.done{background:#23b985;color:white;box-shadow:0 6px 0 #1f8061,0 7px 14px #28594655}.adventure-node.locked{background:#c4d0d9;color:#627381;box-shadow:0 5px 0 #899cac}.adventure-node.current{outline:6px solid #ffed5e77;animation:pulse 1.4s infinite}.adventure-cast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:none}.adventure-cast img{width:85px;height:85px;border-radius:20px;object-fit:cover;border:4px solid white}

function worldIndex(n){return Math.floor((Math.max(1,n)-1)/20)}

 const n=currentLevel(), w=worldDetails(n), begin=w.index*20, end=begin+20,local=w.local;

 for(let i=1;i<=20;i++){

function map(){if(data.unlock>=21){worldMap();return}let stars=Object.values(data.stars).reduce((a,b)=>a+b,0),p=Math.min(20,data.unlock);let nodes='';let points=[];for(let n=1;n<=20;n++){let y=95-(n-1)*4.45,x=[45,67,43,25,42,66,46,26,45,67,47,28,46,68,48,29,45,66,47,50][n-1];points.push(x+','+y);let locked=n>data.unlock,done=!!data.stars[n];nodes+=`<button style="--x:${x}%;--y:${y}%" class="level ${locked?'locked':done?'done':'current'}" onclick="openLevel(${n})" ${locked?'disabled':''} aria-label="Niveau ${n}">${locked?'🔒':n}<span class="mark">${done?'⭐'.repeat(data.stars[n]):''}</span></button>`; if(n===1||n===5||n===10||n===15||n===20)nodes+=`<span class="lvlcaption" style="--x:${x}%;--y:${y}%">${n===20?'🏆 Coupe':NAMES[n-1]}</span>`}
$('view').innerHTML=`<section class="panel"><h2 class="title">🧱 Mon aventure en briques</h2><p class="sub">20 niveaux dans un monde de briques : stade, robot, fusée et château !</p><div class="stats"><span>⭐ ${stars} étoiles</span><span>🏆 ${Math.min(20,data.unlock-1)}/20</span></div><div class="progress"><span style="width:${Math.min(100,(data.unlock-1)*5)}%"></span></div></section><div class="world"><svg class="level-path" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${points.join(' ')}"></polyline><polyline class="inner" points="${points.join(' ')}"></polyline></svg>${nodes}</div><section class="panel"><h2>🧱 Niveau ${p} — ${NAMES[p-1]}</h2><p>Écoute, touche les bonnes réponses et gagne des étoiles !</p><button class="action" onclick="openLevel(${p})">▶ Jouer au niveau ${p}</button></section>`}
function openLevel(n){if(n>data.unlock)return;stopTimer();level=n;tab='play';startGame(gameType(n),n,false)};
function pool(difficulty=1,count=20){let cap=Math.min(WORDS.length,Math.max(22,18+difficulty*9));return WORDS.slice(0,cap)};
function startGame(mode,n=0,standalone=false){stopTimer();const difficulty=n?Math.min(11,Math.ceil(n/8)):2;game={mode,n,standalone,difficulty,score:0,errors:0,total:n?Math.min(10,4+Math.ceil(n/3)):8,index:0,question:null,selected:null,notice:'',finished:false,pairs:[],matched:[],tiles:[],seconds:Math.max(9,19-difficulty),timeLeft:Math.max(9,19-difficulty),buildPieces:0,fallAt:5,turn:0};if(['pairs','memory'].includes(mode)) setupPairs();else if(mode==='rain')setupRain();else makeQ();renderGame();if(mode==='speed')beginSpeed();if(mode==='rain')beginRain()}
function pickQuestion(){let list=pool(game.difficulty);let w=list[rand(list.length)];let dir=rand(2)===0?'he':'fr';let opts=shuffle([w,...shuffle(list.filter(q=>q.id!==w.id)).slice(0,3)]);return{w,dir,options:opts,correct:w.id}}
function makeQ(){game.question=pickQuestion();game.selected=null;game.notice='';game.timeLeft=game.seconds}
function questionHTML(){let q=game.question;if(!q)return'';let mode=game.mode,side=q.dir==='he',qtext=side?q.w.he:q.w.fr,lang=side?'he-IL':'fr-FR';let choices=q.options.map(o=>{let answer=side?o.fr:o.he,highlight=game.selected===o.id?(o.id===q.correct?'correct':'wrong'):'';let cls=side?'':'he';return `<button class="choice ${highlight}" onclick="answer(${o.id})" ${game.selected!==null?'disabled':''}><span class="txt ${cls}">${esc(answer)}</span><span class="aud" onclick="event.stopPropagation();speak('${esc(answer).replace(/&#39;/g,"\\'")}','${side?'fr-FR':'he-IL'}')">🔊</span></button>`}).join('');return `<div class="prompt"><div class="note">${side?'Écoute et trouve en français':'Écoute et trouve en hébreu'}</div><div class="word ${side?'he':''}">${esc(qtext)}</div><button class="audio" onclick="speak(${arg(qtext)},'${lang}')">🔊 Écouter</button></div><div class="choices">${choices}</div>`}
function answer(id){if(!game||game.finished||game.selected!==null)return;game.selected=id;let ok=id===game.question.correct;if(ok){game.score++;game.notice='✅ Bravo ! Tu as trouvé !'}else{game.errors++;game.notice='💛 Essaie encore au prochain mot !';}if(game.mode==='build'){if(ok)game.buildPieces=Math.min(8,game.buildPieces+1);else{game.shatter=game.buildPieces;game.buildPieces=0}}if(game.mode==='speed'){clearInterval(timer);timer=null}renderGame();if(game.mode==='build'&&game.shatter){let robot=$('robot');if(robot){robot.classList.add('break');robot.querySelectorAll('.robotpiece').forEach((e,i)=>{if(i<game.shatter)e.classList.add('on')})}setTimeout(()=>{if(game){game.shatter=0;renderGame()}},900)}}
function nextQ(){if(game.selected===null)return;game.index++;if(game.index>=game.total){finish();return}makeQ();renderGame();if(game.mode==='speed')beginSpeed()}
function beginSpeed(){stopTimer();timer=setInterval(()=>{if(!game||game.mode!=='speed'||game.finished){stopTimer();return}if(game.selected!==null)return;game.timeLeft=Math.max(0,game.timeLeft-.2);let el=$('timefill');if(el)el.style.width=(game.timeLeft/game.seconds*100)+'%';let n=$('timecount');if(n)n.textContent=Math.ceil(game.timeLeft);if(game.timeLeft<=0){stopTimer();game.selected=-1;game.errors++;game.notice='⏰ Le temps est écoulé !';renderGame()}},200)}
function setupPairs(){let list=shuffle(pool(game.difficulty)).slice(0,Math.min(7,3+game.difficulty));let cards=shuffle(list.flatMap(w=>[{tid:'h'+w.id,key:w.id,txt:w.he,lang:'he-IL'},{tid:'f'+w.id,key:w.id,txt:w.fr,lang:'fr-FR'}]));game.tiles=cards;game.selected=null;game.matched=[];game.total=list.length}
function selectPair(tid){let c=game.tiles.find(z=>z.tid===tid);if(!c||game.matched.includes(tid)||game.busy)return;if(!game.selected){game.selected=tid;renderGame();return}if(game.selected===tid){game.selected=null;renderGame();return}let first=game.tiles.find(z=>z.tid===game.selected);if(first.key===c.key&&first.tid!==c.tid){game.matched.push(first.tid,c.tid);game.score++;game.notice='✅ Une paire !';game.selected=null;renderGame();if(game.matched.length===game.tiles.length)finish();}else{game.errors++;game.notice='💛 Pas la même paire !';const a=game.selected,b=tid;game.second=b;game.busy=true;renderGame();setTimeout(()=>{if(!game||!game.busy)return;game.busy=false;game.selected=null;game.second=null;game.notice='';renderGame()},750)}}
function pairHTML(){return `<div class="pair-grid">${game.tiles.map(c=>{let matched=game.matched.includes(c.tid),visible=game.mode!=='memory'||matched||game.selected===c.tid||game.second===c.tid;return `<button class="pair ${matched?'matched':game.selected===c.tid||game.second===c.tid?'chosen':''}" onclick="selectPair('${c.tid}')" ${matched?'disabled':''}>${visible?`<span class="${c.lang==='he-IL'?'he':''}">${esc(c.txt)}</span><span class="speak" onclick="event.stopPropagation();speak(${arg(c.txt)},'${c.lang}')">🔊</span>`:'❓'}</button>`}).join('')}</div>`}
function setupRain(){
 game.mode='rain';
 let list=shuffle(pool(game.difficulty)).slice(0,14);
 game.rainPairs=list.slice(0,4);
 const he=shuffle(game.rainPairs.map(w=>({tid:'h'+w.id,key:w.id,txt:w.he,lang:'he-IL'})));
 const fr=shuffle(game.rainPairs.map(w=>({tid:'f'+w.id,key:w.id,txt:w.fr,lang:'fr-FR'})));
 let tiles=he.concat(fr);
 // No two matching words side by side (or immediately above/below in 2 columns).
 for(let k=0;k<500;k++){
  const candidate=shuffle(he.concat(fr));
  if(candidate.every((c,i)=>candidate.every((d,j)=>i===j || c.key!==d.key ||
      !(Math.abs(i-j)===2 || (Math.floor(i/2)===Math.floor(j/2) && Math.abs(i-j)===1))))){tiles=candidate;break}
 }
 game.tiles=tiles;
 game.selected=null;game.matched=[];game.total=4;
 game.secondsToDrop=60;game.rainPool=shuffle(list.slice(4));game.rainNext=0;
 game.maxTiles=16;game.streak=0;game.turn=0;
}

function rainAdd(){
  if(!game || game.finished || game.mode!=='rain')return;
  // Every drop is a genuine Hebrew/French pair. Unlike the previous implementation,
  // no unmatched orphan tiles can accumulate and make the board unwinnable.
  if(game.tiles.length+2>game.maxTiles){finish(true);return}
  const available=game.rainPool.length?game.rainPool:shuffle(pool(game.difficulty));
  const w=available[game.rainNext++%available.length];
  game.turn++;
  const he={tid:'h'+w.id+'-drop'+game.turn,key:w.id,txt:w.he,lang:'he-IL'};
  const fr={tid:'f'+w.id+'-drop'+game.turn,key:w.id,txt:w.fr,lang:'fr-FR'};
  // Put the two bricks at opposite ends of the board, never next to each other.
  // Reverse the languages sometimes, so position and language don't give clues.
  const first=game.turn%2?he:fr, last=game.turn%2?fr:he;
  game.tiles.unshift(first);
  game.tiles.push(last);
  if(game.tiles.length>=game.maxTiles)finish(true);else renderGame();
}
function beginRain(){stopTimer();timer=setInterval(()=>{if(!game||game.mode!=='rain'||game.finished){stopTimer();return}game.secondsToDrop=Math.max(0,game.secondsToDrop-1);if(game.secondsToDrop===0){game.secondsToDrop=60;rainAdd()}let t=$('fallcount');if(t)t.textContent=game.secondsToDrop;},1000)}
function rainSelect(tid){
 if(!game||game.finished)return;
 const c=game.tiles.find(x=>x.tid===tid);
 if(!c)return;
 if(!game.selected){
   game.selected=tid;
   // Instant visual response: do NOT reconstruct the whole board on first tap.
   const el=document.querySelector(`[data-rain-id="${tid}"]`);
   if(el)el.classList.add('chosen');
   return;
 }
 if(game.selected===tid){
   game.selected=null;
   const el=document.querySelector(`[data-rain-id="${tid}"]`);
   if(el)el.classList.remove('chosen');
   return;
 }
 const a=game.tiles.find(x=>x.tid===game.selected);
 if(a && a.key===c.key && a.lang!==c.lang){
   game.score++;
   game.tiles=game.tiles.filter(z=>z.tid!==tid&&z.tid!==game.selected);
   game.selected=null;game.notice='✅ Bravo, une paire !';
   if(game.tiles.length===0){finish();return}
 }else{
   game.errors++;game.selected=null;game.notice='Réessaie, Ilan !';
 }
 renderGame();
}
function rainHTML(){return `<div class="rain-stats"><span>🧱 ${game.tiles.length}/${game.maxTiles} briques</span><span>⭐ ${game.score} paires</span><span>⏳ <b id="fallcount">${game.secondsToDrop}</b> s</span></div><p class="note">Choisis un mot et sa traduction. 🔊 Pour écouter !</p><div class="rainboard">${game.tiles.map(c=>`<button type="button" data-rain-id="${c.tid}" class="rain-tile ${game.selected===c.tid?'chosen':''} ${c.lang==='he-IL'?'he':''}" onclick="rainSelect('${c.tid}')"><span class="tileword">${esc(c.txt)}</span><span class="aud" onclick="event.stopPropagation();speak(${arg(c.txt)},'${c.lang}')">🔊</span></button>`).join('')}</div>`}

function robotHTML(){let pieces=['leg1','leg2','torso','arm1','arm2','head','eye1','eye2','antenna'];return `<div class="build-stage"><div class="robot" id="robot">${pieces.map((p,i)=>`<div class="robotpiece ${p} ${i<game.buildPieces?'on':''}" style="--dx:${i%2?'110px':'-110px'}"></div>`).join('')}</div><div class="pill">🧱 ${game.buildPieces}/8 briques construites</div></div>`}
function renderGame(){if(!game)return;let n=game.n;let title=game.mode==='champion'?'🏆 Grand championnat':({translate:'🌍 Traduire',pairs:'🔗 Relier les mots',memory:'🃏 Memory',speed:'⚡ Rapidité',build:'🤖 Mon robot',rain:'🧱 Pluie de mots'})[game.mode];let intro=n?`Niveau ${n} — ${NAMES[n-1]}`:'Jeu libre';let more='',done=game.finished;
if(done){result();return}if(game.mode==='pairs'||game.mode==='memory'){more=pairHTML()}else if(game.mode==='rain'){more=rainHTML()}else{if(game.mode==='build')more=robotHTML();if(game.mode==='speed')more+=`<div class="timerbar"><span id="timefill" style="width:${game.timeLeft/game.seconds*100}%"></span></div><div class="chip">⏱️ <span id="timecount">${Math.ceil(game.timeLeft)}</span> secondes</div>`;more+=questionHTML();}
let actions=game.selected!==null && !['pairs','memory','rain'].includes(game.mode)?`<button class="action" onclick="nextQ()">${game.index+1>=game.total?'🏆 Terminer':'➡️ Question suivante'}</button>`:'';
$('view').innerHTML=`<section class="panel"><div class="quiz-head"><div><div class="title">${title}</div><div class="sub">${intro}</div></div><button class="tiny-audio" onclick="speak('כָּל הַכָּבוֹד!','he-IL')">🔊</button></div><div class="stats"><span>⭐ ${game.score} bonnes</span><span>${game.mode==='pairs'||game.mode==='memory'?`${game.score}/${game.total} paires`:game.mode==='rain'?'Trouve les zoug':`${game.index+1}/${game.total}`}</span></div>${more}${game.notice?`<div class="feedback ${game.notice.startsWith('✅')?'good':'bad'}">${game.notice}</div>`:''}${actions}<div class="bottom"><button class="action secondary" onclick="nav('map')">↩️ Carte</button><button class="action secondary" onclick="startGame('${game.mode}',${n},${game.standalone})">🔄 Rejouer</button></div></section>`}
function finish(lost=false){if(!game)return;stopTimer();game.finished=true;game.lost=lost;if(game.n && !lost){let threshold=game.mode==='rain'?Math.max(4,game.score):Math.ceil(game.total*.6);let success=game.mode==='rain'?game.score>=4:game.score>=threshold;if(success){let s=game.mode==='rain'?Math.min(3,game.score>=10?3:game.score>=6?2:1):game.errors===0?3:game.score>=game.total*.8?2:1;data.stars[game.n]=Math.max(s,data.stars[game.n]||0);data.unlock=Math.max(data.unlock,game.n+1);save()}}result()}
function result(){
 let won=!game.lost&&(game.mode==='rain'?game.score>=4:game.n===0?game.score>=4:game.score>=Math.ceil(game.total*.6));
 const star=game.n?data.stars[game.n]||0:Math.min(3,game.score>=8?3:game.score>=5?2:1),next=game.n+1;
 const newWorld=won&&game.n>0&&game.n%20===0&&data.unlock>=next;
 const nextAction=won&&game.n>0&&data.unlock>=next?(newWorld?'<button class="action" onclick="nav(\'map\')">🌍 Découvrir le nouveau monde !</button>':`<button class="action" onclick="openLevel(${next})">➡️ Niveau suivant</button>`):'<button class="action" onclick="nav(\'map\')">🗺️ Ma carte</button>';
 $('view').innerHTML=`<section class="panel" style="text-align:center"><div class="cloud">${won?'🏆🤖🎉':'🧱💪'}</div><h2 class="title">${won?'Bravo Ilan !':'On réessaie !'}</h2><p>${newWorld?'Tu as débloqué un monde avec la famille !':won?'Tu as construit une belle victoire !':'Encore un essai et tu progresseras !'}</p><div class="bigscore">${game.score} ⭐</div><div style="font-size:30px;margin:8px">${won?'⭐'.repeat(star):'🧱'}</div><p class="note">${game.mode==='rain'?'Paires retrouvées':'Bonnes réponses'} : ${game.score}</p><div class="bottom"><button class="action secondary" onclick="startGame('${game.mode}',${game.n},${game.standalone})">🔄 Rejouer</button>${nextAction}</div></section>`;
 if(won)speak('כָּל הַכָּבוֹד!','he-IL');
}
function words(){let q=WORDS;let cards=q.map(w=>`<div class="pair" style="min-height:90px"><div class="he" style="font-size:24px">${esc(w.he)}</div><div style="font-size:13px">${esc(w.fr)}</div><div><button class="tiny-audio" onclick="speak(${arg(w.he)},'he-IL')">🇮🇱 🔊</button> <button class="tiny-audio" onclick="speak(${arg(w.fr)},'fr-FR')">🇫🇷 🔊</button></div></div>`).join('');$('view').innerHTML=`<section class="panel"><h2 class="title">🔊 Mes mots avec nékoudot</h2><p class="sub">Appuie sur le drapeau pour écouter en hébreu ou en français.</p><div class="pair-grid">${cards}</div></section>`}
// Expose one safe global namespace for inline iOS-compatible controls.
Object.assign(window,{nav,openLevel,startGame,answer,nextQ,selectPair,rainSelect,speak,chooseWorld});draw();
</script></body></html>
